<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<title>DartForge</title>
<style>
  :root {
    /* True black output to match the desktop terminal; chrome is a hair
       lighter so the header / input / d-pad read as distinct surfaces. */
    --bg: #000000;
    --bg-chrome: #0a0a0c;
    --bg-input: #15151a;
    --fg: #f8f8f2;
    --fg-dim: #6272a4;
    --cyan: #8be9fd;
    --green: #50fa7b;
    --red: #ff5555;
    --orange: #ffb86c;
    --purple: #bd93f9;
    --border: #2a2a31;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
    /* Terminal output palette — mirrors the desktop terminal's DEFAULT_THEME
       so companion output matches the desktop exactly (the previous Dracula
       values made white/bright-white nearly identical and threw the who
       colors off). Overridden live by the pushed theme config when the user
       has customized their colors. --out-fg is the default (uncolored) text. */
    --out-fg: #c0c0c0;
    --ansi-black: #000000;
    --ansi-red: #8b0000;
    --ansi-green: #008000;
    --ansi-yellow: #cccc00;
    --ansi-blue: #1e90ff;
    --ansi-magenta: #800080;
    --ansi-cyan: #008b8b;
    --ansi-white: #c0c0c0;
    --ansi-bright-black: #808080;
    --ansi-bright-red: #ff0000;
    --ansi-bright-green: #00ff00;
    --ansi-bright-yellow: #ffff00;
    --ansi-bright-blue: #0000ff;
    --ansi-bright-magenta: #ff00ff;
    --ansi-bright-cyan: #00ffff;
    --ansi-bright-white: #ffffff;
    /* Monospace stack tuned for ASCII-map fidelity (avoids Courier New,
       whose loose metrics made the hex map look scrunched). */
    --mono: ui-monospace, 'Cascadia Mono', 'Cascadia Code', Consolas, Menlo,
            'DejaVu Sans Mono', 'Liberation Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    position: fixed;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 13px;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-text-size-adjust: none;
    touch-action: manipulation;
  }

  #app {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
  }

  /* ── Header ──────────────────────────────────────── */
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--bg-chrome);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .brand-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    color: var(--cyan);
  }

  .brand-name {
    font-size: 15px;
    font-weight: bold;
    color: var(--cyan);
    white-space: nowrap;
  }

  /* ── Status ──────────────────────────────────────── */
  #status-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--fg-dim);
    white-space: nowrap;
  }

  #status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--red);
    transition: background 0.3s;
    flex-shrink: 0;
  }

  #status-dot.connected { background: var(--green); }
  #status-dot.ws-only { background: var(--orange); }

  /* Connection state word beside the dot: Live / Reconnecting / Desktop
     offline / Companion off. Colored to match the dot. */
  #status-text {
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--red);
  }
  #status-text.connected { color: var(--green); }
  #status-text.ws-only { color: var(--orange); }

  /* ── Power button ────────────────────────────────── */
  #power-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
  }
  #power-btn svg { width: 16px; height: 16px; }
  #power-btn:active { opacity: 0.7; }
  #power-btn.connected { color: var(--green); border-color: var(--green); }
  #power-btn.disconnected { color: var(--red); border-color: var(--border); }

  /* ── Vitals (character status) bar ───────────────── */
  /* Mirrors the desktop status bar, pinned above the command input. On phones
     the readouts collapse to icon-only chips (state is conveyed by color); tap
     a chip to reveal its label. Wide screens show full labels like desktop. */
  #vitals {
    display: none;
    align-items: center;
    gap: 5px;
    padding: 6px 10px;
    background: var(--bg-chrome);
    border-top: 1px solid var(--border);
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
    flex-shrink: 0;
    scrollbar-width: none;
  }
  #vitals.populated { display: flex; }
  #vitals::-webkit-scrollbar { display: none; }

  .vital {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
    padding: 4px 6px;
    border-radius: 3px;
    border-left: 2px solid currentColor;
    background: rgba(255, 255, 255, 0.04);
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .vital svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    display: block;
  }

  /* Collapsed (icon-only) by default; revealed when the chip is expanded. */
  .vital-label { display: none; }
  .vital.show-label { padding-right: 8px; }
  .vital.show-label .vital-label { display: inline; }

  .vital.danger {
    animation: vital-flash 1s ease-in-out infinite;
  }

  @keyframes vital-flash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* ── Sub bar (clock + Who/Counters toggles + font size) ── */
  #subbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px;
    background: var(--bg-chrome);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    font-size: 11px;
  }
  #clock {
    color: var(--fg-dim);
    white-space: nowrap;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #clock b { color: var(--cyan); font-weight: bold; }
  .subbar-spacer { flex: 1; }
  .subbar-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 26px;
    padding: 0 8px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--fg-dim);
    font-family: inherit;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
  }
  .subbar-btn:active { background: var(--border); }
  .subbar-btn.active { color: var(--cyan); border-color: var(--cyan); }
  .subbar-btn.icon-only { width: 28px; padding: 0; justify-content: center; }

  /* ── Aux panels (Who / Counters) ─────────────────── */
  .aux-panel {
    display: none;
    flex-shrink: 0;
    max-height: 40vh;
    overflow-y: auto;
    background: var(--bg-chrome);
    border-bottom: 1px solid var(--border);
    padding: 6px 10px;
    font-size: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .aux-panel.open { display: block; }
  .aux-title {
    color: var(--fg-dim);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 5px;
  }
  .who-row { display: flex; align-items: baseline; gap: 6px; padding: 2px 0; white-space: nowrap; }
  /* Per-guild colored tag (brackets + abbreviation), mirrors the desktop
     Who panel's GUILD_STYLES rather than a flat purple. */
  .who-guild-tag { font-size: 9px; font-weight: bold; white-space: nowrap; flex-shrink: 0; }
  .who-state { width: 5px; height: 5px; border-radius: 50%; margin-left: auto; align-self: center; flex-shrink: 0; }
  .who-row.title-row { color: var(--fg-dim); font-style: italic; }
  .counter-row { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; flex-wrap: wrap; }
  .counter-name { font-weight: bold; }
  .counter-name.active { color: var(--green); }
  .counter-stat { color: var(--fg-dim); font-size: 11px; }
  .counter-stat b { color: var(--orange); font-weight: bold; }

  /* ── Quick buttons row ───────────────────────────── */
  #quickbtns {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: var(--bg-chrome);
    border-top: 1px solid var(--border);
    overflow-x: auto;
    white-space: nowrap;
    flex-shrink: 0;
    scrollbar-width: none;
  }
  #quickbtns.populated { display: flex; }
  #quickbtns::-webkit-scrollbar { display: none; }
  .qbtn {
    flex-shrink: 0;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid currentColor;
    background: rgba(255, 255, 255, 0.04);
    font-family: inherit;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .qbtn:active { opacity: 0.7; }
  .qbtn.disabled { opacity: 0.4; pointer-events: none; }

  /* ── Timer / counter chips row ───────────────────── */
  /* Display-only mirror of the desktop's running timers and scheduled
     items. Running chips are filled (translucent) with a glowing dot;
     scheduled chips are outlined and dimmer. Colors come from the desktop
     as-is via inline style. */
  #chips {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    background: var(--bg-chrome);
    border-top: 1px solid var(--border);
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
    flex-shrink: 0;
    scrollbar-width: none;
  }
  #chips.populated { display: flex; }
  #chips::-webkit-scrollbar { display: none; }
  /* Phones are short on vertical room: the chips row only shows on the
     wider laptop/tablet layout. */
  @media (max-width: 759px) {
    #chips.populated { display: none; }
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
    height: 22px;
    padding: 0 9px;
    border-radius: 999px;
    border: 1px solid currentColor;
    font-size: 10px;
    font-weight: bold;
    line-height: 1;
    letter-spacing: 0.02em;
  }
  .chip-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 6px currentColor;
    flex-shrink: 0;
    animation: chip-glow 1.6s ease-in-out infinite;
  }
  @keyframes chip-glow {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }
  .chip.scheduled { opacity: 0.55; border-style: dashed; }
  .chip-detail { font-weight: normal; opacity: 0.8; }

  /* ── Reconnect banner ────────────────────────────── */
  #reconnect-banner {
    display: none;
    padding: 8px 14px;
    background: var(--red);
    color: #000;
    font-size: 12px;
    font-weight: bold;
    text-align: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #reconnect-banner.visible { display: block; }
  /* Companion switched off on the desktop: no auto-retry, tap to retry. */
  #reconnect-banner.off { background: var(--orange); }

  /* Brief shake when a command is refused because nothing is connected. */
  @keyframes input-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  #cmd-input.shake {
    animation: input-shake 0.35s ease-in-out;
    border-color: var(--red);
  }

  /* ── Output ──────────────────────────────────────── */
  #output-wrap {
    flex: 1;
    position: relative;
    min-height: 0;
  }

  #output {
    height: 100%;
    overflow-y: auto;
    padding: 10px 12px;
    white-space: pre-wrap;
    word-wrap: break-word;
    /* Default (uncolored) MUD text uses the terminal foreground, not the
       brighter chrome --fg, so plain output matches the desktop terminal. */
    color: var(--out-fg);
    /* Tight line-height keeps the hex map's aspect ratio correct. */
    line-height: 1.2;
    -webkit-overflow-scrolling: touch;
  }

  #output::-webkit-scrollbar { width: 6px; }
  #output::-webkit-scrollbar-track { background: transparent; }
  #output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── ANSI colors ─────────────────────────────────── */
  /* All resolve to theme variables so a pushed custom theme recolors output
     live; defaults (in :root) match the desktop terminal palette. */
  .ansi-black { color: var(--ansi-black); }
  .ansi-bright-black { color: var(--ansi-bright-black); }
  .ansi-red { color: var(--ansi-red); }
  .ansi-green { color: var(--ansi-green); }
  .ansi-yellow { color: var(--ansi-yellow); }
  .ansi-blue { color: var(--ansi-blue); }
  .ansi-magenta { color: var(--ansi-magenta); }
  .ansi-cyan { color: var(--ansi-cyan); }
  .ansi-white { color: var(--ansi-white); }
  .ansi-bright-red { color: var(--ansi-bright-red); }
  .ansi-bright-green { color: var(--ansi-bright-green); }
  .ansi-bright-yellow { color: var(--ansi-bright-yellow); }
  .ansi-bright-blue { color: var(--ansi-bright-blue); }
  .ansi-bright-magenta { color: var(--ansi-bright-magenta); }
  .ansi-bright-cyan { color: var(--ansi-bright-cyan); }
  .ansi-bright-white { color: var(--ansi-bright-white); }
  .ansi-bold { font-weight: bold; }
  .ansi-bg-black { background-color: var(--ansi-black); }
  .ansi-bg-red { background-color: var(--ansi-red); }
  .ansi-bg-green { background-color: var(--ansi-green); }
  .ansi-bg-yellow { background-color: var(--ansi-yellow); }
  .ansi-bg-blue { background-color: var(--ansi-blue); }
  .ansi-bg-magenta { background-color: var(--ansi-magenta); }
  .ansi-bg-cyan { background-color: var(--ansi-cyan); }
  .ansi-bg-white { background-color: var(--ansi-white); }
  .ansi-bg-bright-black { background-color: var(--ansi-bright-black); }
  .ansi-bg-bright-red { background-color: var(--ansi-bright-red); }
  .ansi-bg-bright-green { background-color: var(--ansi-bright-green); }
  .ansi-bg-bright-yellow { background-color: var(--ansi-bright-yellow); }
  .ansi-bg-bright-blue { background-color: var(--ansi-bright-blue); }
  .ansi-bg-bright-magenta { background-color: var(--ansi-bright-magenta); }
  .ansi-bg-bright-cyan { background-color: var(--ansi-bright-cyan); }
  .ansi-bg-bright-white { background-color: var(--ansi-bright-white); }
  /* Inverse video (SGR 7) with default fg/bg: swap terminal fg and bg. */
  .ansi-inv-bg { background-color: var(--out-fg); }
  .ansi-inv-fg { color: var(--bg); }

  /* ── Scroll-to-bottom button ────────────────────── */
  #scroll-notice {
    display: none;
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--purple);
    color: #000;
    font-size: 11px;
    font-weight: bold;
    padding: 5px 14px;
    border-radius: 12px;
    cursor: pointer;
    z-index: 10;
    -webkit-tap-highlight-color: transparent;
  }
  #scroll-notice.visible { display: block; }

  /* ── D-pad ───────────────────────────────────────── */
  #qbar-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 22px;
    background: var(--bg-chrome);
    border: none;
    border-top: 1px solid var(--border);
    color: var(--fg-dim);
    font-family: inherit;
    font-size: 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
  }
  #qbar-toggle:active { color: var(--cyan); }

  #quick-bar {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 8px 10px;
    background: var(--bg-chrome);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  #quick-bar.collapsed { display: none; }

  .qrow {
    display: flex;
    gap: 4px;
    justify-content: center;
    align-items: center;
  }

  .quick-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    height: 40px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--cyan);
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    padding: 0 8px;
    -webkit-tap-highlight-color: transparent;
  }

  .quick-btn:active {
    background: var(--border);
  }

  .qsep {
    width: 8px;
    flex-shrink: 0;
  }

  /* ── Input ───────────────────────────────────────── */
  /* ── Input area (history strip + command row) ──── */
  #input-area {
    background: var(--bg-chrome);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .history-btns {
    display: flex;
    gap: 0;
    flex-shrink: 0;
  }

  .hist-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    height: 32px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--fg-dim);
    font-family: inherit;
    font-size: 10px;
    gap: 4px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .hist-btn:first-child { border-right: 1px solid var(--border); }
  .hist-btn:active { background: rgba(139, 233, 253, 0.06); color: var(--cyan); }
  .hist-btn svg { width: 12px; height: 12px; }

  #input-bar {
    display: flex;
    gap: 8px;
    padding: 8px 10px 10px;
  }

  #cmd-input {
    flex: 1;
    min-width: 0;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--fg);
    font-family: inherit;
    font-size: 16px;
    padding: 12px 14px;
    outline: none;
    -webkit-appearance: none;
  }

  #cmd-input:focus { border-color: var(--cyan); }
  #cmd-input::placeholder { color: var(--fg-dim); }

  #send-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 50px;
    background: var(--cyan);
    color: #000;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
  }

  #send-btn svg { width: 20px; height: 20px; }
  #send-btn:active { opacity: 0.8; }
  #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Desktop-only hint about keyboard movement. */
  #kbd-hint {
    display: none;
    padding: 0 12px 8px;
    color: var(--fg-dim);
    font-size: 10px;
    letter-spacing: 0.03em;
  }
  #kbd-hint b { color: var(--cyan); font-weight: bold; }

  /* ── Empty state ─────────────────────────────────── */
  #empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 40px 20px;
    color: var(--fg-dim);
    text-align: center;
    font-size: 12px;
  }
  #empty-state.hidden { display: none; }

  /* ── Landscape (short viewports) ─────────────────── */
  @media (max-height: 500px) {
    .quick-btn { height: 34px; min-width: 38px; font-size: 12px; }
    #quick-bar { padding: 5px 10px; gap: 3px; }
    #input-bar { padding: 6px 10px; }
    #cmd-input { padding: 10px 12px; font-size: 15px; }
    #header { padding: 6px 12px; }
  }

  /* Large phones — roomier directional buttons. */
  @media (min-width: 420px) and (max-width: 759px) {
    .quick-btn { min-width: 50px; height: 42px; }
  }

  /* ── Desktop layout ──────────────────────────────── */
  /* On wide screens this runs as a "play from my laptop" client: the
     on-screen d-pad and Prev/Next strip are hidden (use the numpad and
     arrow keys instead), output gets more room, and the keyboard hint
     appears. */
  @media (min-width: 760px) {
    body { font-size: 14px; }
    #qbar-toggle,
    #quick-bar,
    .history-btns { display: none !important; }
    /* Output, vitals and input all share the same left edge (full width,
       left-aligned) so nothing floats in a centered column. */
    #output { padding: 12px 18px; }
    #input-bar { padding: 10px 18px 12px; }
    #cmd-input { font-size: 15px; }
    #vitals { padding: 7px 18px; }
    #subbar { padding: 5px 18px; }
    #quickbtns { padding: 6px 18px; }
    .aux-panel { padding: 8px 18px; }
    #kbd-hint { display: block; padding: 0 18px 8px; }
    #send-btn { width: 56px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>

<script>
(function() {
  'use strict';

  // ── ANSI parser ───────────────────────────────────────────────
  // Palette slots 0-15 map to CSS classes so they follow the pushed terminal
  // theme (exactly as the desktop terminal treats them). 256-color and
  // truecolor values are drawn from the fixed standard palette instead, so
  // they're emitted as literal hex on the span — same split the desktop's
  // ansiColorExtract.ts makes.
  var FG_CLASSES = [
    'ansi-black', 'ansi-red', 'ansi-green', 'ansi-yellow',
    'ansi-blue', 'ansi-magenta', 'ansi-cyan', 'ansi-white',
    'ansi-bright-black', 'ansi-bright-red', 'ansi-bright-green', 'ansi-bright-yellow',
    'ansi-bright-blue', 'ansi-bright-magenta', 'ansi-bright-cyan', 'ansi-bright-white'
  ];
  var BG_CLASSES = [
    'ansi-bg-black', 'ansi-bg-red', 'ansi-bg-green', 'ansi-bg-yellow',
    'ansi-bg-blue', 'ansi-bg-magenta', 'ansi-bg-cyan', 'ansi-bg-white',
    'ansi-bg-bright-black', 'ansi-bg-bright-red', 'ansi-bg-bright-green', 'ansi-bg-bright-yellow',
    'ansi-bg-bright-blue', 'ansi-bg-bright-magenta', 'ansi-bg-bright-cyan', 'ansi-bg-bright-white'
  ];

  /** 6x6x6 color cube component levels used by xterm for indices 16-231. */
  var CUBE_LEVELS = [0, 95, 135, 175, 215, 255];

  function hex2(n) {
    n = Math.max(0, Math.min(255, n | 0));
    return (n < 16 ? '0' : '') + n.toString(16);
  }

  /** Convert a 256-color palette index (16-255) to a #rrggbb string. */
  function paletteHex(idx) {
    if (idx >= 232) {
      var v = 8 + (idx - 232) * 10;
      return '#' + hex2(v) + hex2(v) + hex2(v);
    }
    var n = idx - 16;
    return '#' + hex2(CUBE_LEVELS[Math.floor(n / 36) % 6]) +
      hex2(CUBE_LEVELS[Math.floor(n / 6) % 6]) +
      hex2(CUBE_LEVELS[n % 6]);
  }

  /** Color spec for a `38;5;N` / `48;5;N` palette index, or null if invalid. */
  function specFromIndex(n) {
    if (typeof n !== 'number' || isNaN(n) || n < 0 || n > 255) return null;
    if (n < 16) return { idx: n };
    return { hex: paletteHex(n) };
  }

  // Stateful SGR parser. Tracks bold + inverse + current fg/bg across escapes
  // and emits one span per text run. Parameters are consumed in order so the
  // extended-color forms (`38;5;N`, `38;2;R;G;B` and their `48;…` background
  // equivalents, which DartMUD sends when the character's terminal is set to
  // ansi256) don't leak their arguments into the simple 30-37 branch.
  // Bold upgrades a normal foreground (30-37) to its bright variant, matching
  // xterm's default drawBoldTextInBrightColors — many MUDs (DartMUD included)
  // send "bright" colors as bold + normal color. Inverse (SGR 7) swaps fg/bg,
  // which DartMUD uses for guild tags like the black-on-white [HG].
  function ansiToHtml(text) {
    var result = '';
    var spanOpen = false;
    var bold = false;
    var inverse = false;
    var fg = null; // { idx: 0-15 } | { hex: '#rrggbb' } | null
    var bg = null;

    function reopenSpan() {
      if (spanOpen) { result += '</span>'; spanOpen = false; }

      var cls = [];
      var style = '';
      var f = fg;
      var b = bg;

      // Bold promotes a normal palette color to its bright variant.
      if (f && f.idx !== undefined && bold && f.idx < 8) f = { idx: f.idx + 8 };
      if (bold) cls.push('ansi-bold');

      if (inverse) {
        var tmp = f;
        f = b || 'inv';
        b = tmp || 'inv';
      }

      if (f === 'inv') cls.push('ansi-inv-fg');
      else if (f) {
        if (f.hex) style += 'color:' + f.hex + ';';
        else cls.push(FG_CLASSES[f.idx]);
      }
      if (b === 'inv') cls.push('ansi-inv-bg');
      else if (b) {
        if (b.hex) style += 'background-color:' + b.hex + ';';
        else cls.push(BG_CLASSES[b.idx]);
      }

      if (cls.length || style) {
        result += '<span' + (cls.length ? ' class="' + cls.join(' ') + '"' : '') +
          (style ? ' style="' + style + '"' : '') + '>';
        spanOpen = true;
      }
    }

    // Split on every escape sequence, not just SGR: any CSI (ESC [ params
    // intermediates final), OSC (ESC ] ... BEL or ESC \), charset / two-byte
    // ESC sequences (ESC ( B, ESC =, ESC 7). Only SGR "m" sequences change
    // state; every other escape is consumed and dropped so ESC[K, ESC[2J and
    // cursor moves never print as garbage.
    var parts = text.split(ESC_SPLIT_RE);
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i];
      if (!part) continue;
      var match = part.match(/^\x1b\[([0-9;]*)m$/);
      if (!match && part.charCodeAt(0) === 0x1b) continue;
      if (match) {
        // An empty parameter list (ESC[m) means reset.
        var codes = match[1] === ''
          ? [0]
          : match[1].split(';').map(function(p) { return p === '' ? 0 : Number(p); });
        for (var j = 0; j < codes.length; j++) {
          var code = codes[j];
          if (code === 0) { bold = false; inverse = false; fg = null; bg = null; }
          else if (code === 1) bold = true;
          else if (code === 7) inverse = true;
          else if (code === 22) bold = false;
          else if (code === 27) inverse = false;
          else if (code === 39) fg = null;
          else if (code === 49) bg = null;
          else if (code >= 30 && code <= 37) fg = { idx: code - 30 };
          else if (code >= 90 && code <= 97) fg = { idx: code - 90 + 8 };
          else if (code >= 40 && code <= 47) bg = { idx: code - 40 };
          else if (code >= 100 && code <= 107) bg = { idx: code - 100 + 8 };
          else if (code === 38 || code === 48) {
            var mode = codes[j + 1];
            var spec = null;
            if (mode === 5) {
              spec = specFromIndex(codes[j + 2]);
              j += 2;
            } else if (mode === 2) {
              spec = { hex: '#' + hex2(codes[j + 2]) + hex2(codes[j + 3]) + hex2(codes[j + 4]) };
              j += 4;
            } else {
              // Unknown extended-color form; skip the mode selector so its
              // arguments can't be misread as separate SGR codes.
              j += 1;
            }
            if (spec) {
              if (code === 38) fg = spec;
              else bg = spec;
            }
          }
        }
        reopenSpan();
      } else {
        // A stray ESC that didn't form a sequence (chunk split mid-escape)
        // is dropped rather than rendered.
        result += part.replace(/\x1b/g, '')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
    }

    if (spanOpen) result += '</span>';
    return result;
  }

  // CSI: ESC [ then parameter bytes 0x30-0x3F, intermediates 0x20-0x2F, one
  // final byte 0x40-0x7E. OSC: ESC ] up to BEL or ESC \ (terminator optional
  // so an unterminated title string at the end of a chunk still vanishes).
  // Then ESC + intermediates + final (ESC ( B), and bare two-byte ESC x
  // sequences excluding [ and ] which the first two branches own.
  var ESC_SPLIT_RE = /(\x1b\[[0-?]*[ -\/]*[@-~]|\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)?|\x1b[ -\/]+[0-~]|\x1b[0-Z\\^-~])/;

  // ── Terminal theme (mirrors desktop DEFAULT_THEME; overridden live) ──
  // Kept in sync with the desktop's customizable palette via the 'config'
  // message so who guild tags and (via CSS vars) output colors track it.
  var DEFAULT_ANSI_THEME = {
    foreground: '#c0c0c0', black: '#000000', red: '#8b0000', green: '#008000',
    yellow: '#cccc00', blue: '#1e90ff', magenta: '#800080', cyan: '#008b8b', white: '#c0c0c0',
    brightBlack: '#808080', brightRed: '#ff0000', brightGreen: '#00ff00', brightYellow: '#ffff00',
    brightBlue: '#0000ff', brightMagenta: '#ff00ff', brightCyan: '#00ffff', brightWhite: '#ffffff'
  };
  var currentTheme = DEFAULT_ANSI_THEME;

  /** Resolve a theme slot from the broadcast theme, falling back to the
      desktop default for that same slot (never a substitute palette). */
  function themeColor(key) {
    var v = currentTheme && currentTheme[key];
    return (typeof v === 'string' && v) ? v : DEFAULT_ANSI_THEME[key];
  }

  var THEME_CSS_VARS = {
    '--out-fg': 'foreground', '--ansi-black': 'black', '--ansi-red': 'red',
    '--ansi-green': 'green', '--ansi-yellow': 'yellow', '--ansi-blue': 'blue',
    '--ansi-magenta': 'magenta', '--ansi-cyan': 'cyan', '--ansi-white': 'white',
    '--ansi-bright-black': 'brightBlack', '--ansi-bright-red': 'brightRed',
    '--ansi-bright-green': 'brightGreen', '--ansi-bright-yellow': 'brightYellow',
    '--ansi-bright-blue': 'brightBlue', '--ansi-bright-magenta': 'brightMagenta',
    '--ansi-bright-cyan': 'brightCyan', '--ansi-bright-white': 'brightWhite'
  };

  function applyTheme(t) {
    if (!t || typeof t !== 'object') return;
    currentTheme = t;
    var root = document.documentElement;
    for (var cssVar in THEME_CSS_VARS) {
      var val = t[THEME_CSS_VARS[cssVar]];
      if (typeof val === 'string' && val) root.style.setProperty(cssVar, val);
    }
    // Guild tags, vitals and quick buttons are inline-styled from the theme,
    // so re-render anything whose fallback color resolves through it.
    if (lastWhoData) renderWho(lastWhoData);
    if (lastReadouts.length) renderVitals(lastReadouts);
    if (lastQuickButtons) renderQuickButtons(lastQuickButtons);
  }

  // Guild tag styles — mirror the desktop Who panel's GUILD_STYLES. Values are
  // theme color keys, resolved against currentTheme at render time.
  var GUILD_STYLES = {
    BH: { color: 'brightYellow', bracketColor: 'magenta' },
    DG: { color: 'brightYellow', bracketColor: 'brightBlue' },
    DK: { color: 'white', bg: 'blue', bracketColor: 'white' },
    HG: { color: 'black', bg: 'white', bracketColor: 'black' },
    MG: { color: 'brightCyan', bracketColor: 'white' },
    RoE: { color: 'white', bg: 'red', bracketColor: 'white' },
    SR: { color: 'brightGreen', bracketColor: 'white' }
  };

  function guildTagHtml(guild) {
    var style = GUILD_STYLES[guild];
    if (!style) {
      // Unknown guild: the theme's dim (bright black) slot, not a fixed grey.
      return '<span class="who-guild-tag" style="color:' + themeColor('brightBlack') + '">[' +
        esc(guild) + ']</span>';
    }
    var color = themeColor(style.color);
    var bracket = themeColor(style.bracketColor || style.color);
    var wrap = '';
    if (style.bg) {
      var bg = currentTheme[style.bg];
      if (bg) wrap = 'background-color:' + bg + ';padding:0 2px;border-radius:2px;';
    }
    return '<span class="who-guild-tag" style="' + wrap + '">' +
      '<span style="color:' + bracket + '">[</span>' +
      '<span style="color:' + color + '">' + esc(guild) + '</span>' +
      '<span style="color:' + bracket + '">]</span></span>';
  }

  // ── Vitals icons (mirror the desktop status-bar SVGs) ─────────
  var VITAL_ICONS = {
    health: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',
    concentration: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/></svg>',
    aura: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.09 3.36L16.36 4l-1.36 3.27L18.36 8.36l-3.36 1.09L16 12.73l-3.27-1.36L11.64 14.73l-1.09-3.36L7.27 12.73l1.36-3.27L5.27 8.36l3.36-1.09L7.27 4l3.27 1.36z"/><path d="M19 15l.54 1.66 1.66.54-1.66.54L19 19.4l-.54-1.66-1.66-.54 1.66-.54z" opacity="0.7"/><path d="M5 17l.36 1.1 1.1.36-1.1.36L5 19.92l-.36-1.1-1.1-.36 1.1-.36z" opacity="0.5"/></svg>',
    hunger: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>',
    thirst: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>',
    encumbrance: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3c0 1.1.6 2.1 1.5 2.6L9 22h6l-1.5-14.4A3 3 0 0 0 15 5a3 3 0 0 0-3-3z"/></svg>',
    movement: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 20h10v2H7zM15 4l-1 4h3l-1 4h3v6H5v-6h3l-1-4h3L9 4z"/></svg>',
    alignment: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="3" x2="12" y2="15"/><polygon points="12,3 4,9 20,9" fill="none"/><line x1="4" y1="9" x2="3" y2="17"/><line x1="20" y1="9" x2="21" y2="17"/><ellipse cx="3" cy="18" rx="1.5" ry="1" fill="currentColor" stroke="none"/><ellipse cx="21" cy="18" rx="1.5" ry="1" fill="currentColor" stroke="none"/><line x1="8" y1="21" x2="16" y2="21"/></svg>'
  };

  // ── Elements ──────────────────────────────────────────────────
  var output = document.getElementById('output');
  var cmdInput = document.getElementById('cmd-input');
  var sendBtn = document.getElementById('send-btn');
  var statusDot = document.getElementById('status-dot');
  var statusText = document.getElementById('status-text');
  var chipsRow = document.getElementById('chips');
  var notifBtn = document.getElementById('notif-btn');
  var clearBtn = document.getElementById('clear-btn');
  var reconnectBanner = document.getElementById('reconnect-banner');
  var scrollNotice = document.getElementById('scroll-notice');
  var emptyState = document.getElementById('empty-state');
  var powerBtn = document.getElementById('power-btn');
  var qbarToggle = document.getElementById('qbar-toggle');
  var quickBar = document.getElementById('quick-bar');
  var histUp = document.getElementById('hist-up');
  var histDown = document.getElementById('hist-down');
  var vitalsBar = document.getElementById('vitals');
  var clockEl = document.getElementById('clock');
  var whoBtn = document.getElementById('who-btn');
  var ctrBtn = document.getElementById('ctr-btn');
  var whoPanel = document.getElementById('who-panel');
  var countersPanel = document.getElementById('counters-panel');
  var quickBtns = document.getElementById('quickbtns');
  var fontDec = document.getElementById('font-dec');
  var fontInc = document.getElementById('font-inc');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // ── State ─────────────────────────────────────────────────────
  var ws = null;
  var mudConnected = false;
  var companionOff = false;   // desktop reported the companion was switched off
  var passwordMode = false;   // desktop is prompting for a password
  var autoScroll = true;
  var hasOutput = false;
  var MAX_OUTPUT_LINES = 2000;
  var commandHistory = [];
  var historyIndex = -1;
  var searchPrefix = '';
  var lastQuickButtons = null;

  /** Short tap feedback where the device supports it (no-op on iOS). */
  function haptic(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms || 10); } catch (e) {}
  }

  // ── Vitals rendering ──────────────────────────────────────────
  // Each readout is collapsed (icon-only) or expanded (icon + label),
  // tracked per key and persisted. Default is collapsed on phones and
  // expanded on desktop; tapping a chip toggles it on either device.
  var lastReadouts = [];
  var lastWhoData = null;
  var vitalCollapse = {};
  try { vitalCollapse = JSON.parse(localStorage.getItem('df-vitals-collapse') || '{}') || {}; } catch(e) {}
  var wideMq = window.matchMedia('(min-width: 760px)');

  function isCollapsed(key) {
    if (Object.prototype.hasOwnProperty.call(vitalCollapse, key)) return !!vitalCollapse[key];
    return !wideMq.matches; // default: collapsed on mobile, expanded on desktop
  }

  function renderVitals(readouts) {
    lastReadouts = Array.isArray(readouts) ? readouts : [];
    if (lastReadouts.length === 0) {
      vitalsBar.classList.remove('populated');
      vitalsBar.innerHTML = '';
      return;
    }
    var html = '';
    for (var i = 0; i < lastReadouts.length; i++) {
      var r = lastReadouts[i];
      var icon = VITAL_ICONS[r.key] || '';
      var color = (r.color || themeColor('foreground')).replace(/"/g, '');
      var label = String(r.label == null ? '' : r.label)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      var expanded = !isCollapsed(r.key);
      html += '<span class="vital' + (expanded ? ' show-label' : '') + (r.danger ? ' danger' : '') +
        '" data-key="' + r.key + '" style="color:' + color + '" title="' + label + '">' +
        icon + '<span class="vital-label">' + label + '</span></span>';
    }
    vitalsBar.innerHTML = html;
    vitalsBar.classList.add('populated');
  }

  // Tap a chip to expand/collapse its label — persisted, works on any device.
  vitalsBar.addEventListener('click', function(e) {
    var pill = e.target.closest('.vital');
    if (!pill) return;
    pill.classList.toggle('show-label');
    var key = pill.getAttribute('data-key');
    if (key) {
      vitalCollapse[key] = !pill.classList.contains('show-label');
      try { localStorage.setItem('df-vitals-collapse', JSON.stringify(vitalCollapse)); } catch(e) {}
    }
  });

  // Re-render when crossing the mobile/desktop breakpoint so the default for
  // chips the user hasn't explicitly toggled follows the device.
  if (wideMq.addEventListener) {
    wideMq.addEventListener('change', function() { renderVitals(lastReadouts); });
  } else if (wideMq.addListener) {
    wideMq.addListener(function() { renderVitals(lastReadouts); });
  }

  // ── Companion panels (clock, Who, Counters, quick buttons) ────
  function handleState(key, data) {
    if (key === 'clock') renderClock(data);
    else if (key === 'who') renderWho(data);
    else if (key === 'counters') renderCounters(data);
    else if (key === 'quickbuttons') renderQuickButtons(data);
    else if (key === 'chips') renderChips(data);
    else if (key === 'input') setPasswordMode(!!(data && data.passwordMode));
    else if (key === 'tell') handleTell(data);
  }

  // ── Password mode ─────────────────────────────────────────────
  // While the desktop is at a password prompt the field is masked, the
  // command is kept out of local history and never re-shown after send.
  // Prefer -webkit-text-security (keeps type="text", so iOS doesn't pop its
  // password autofill bar); fall back to type="password" where unsupported.
  var TEXT_SECURITY_OK = false;
  try {
    TEXT_SECURITY_OK = !!(window.CSS && CSS.supports && CSS.supports('-webkit-text-security', 'disc'));
  } catch (e) {}

  function setPasswordMode(on) {
    on = !!on;
    if (on === passwordMode) return;
    passwordMode = on;
    if (TEXT_SECURITY_OK) {
      cmdInput.style.webkitTextSecurity = on ? 'disc' : '';
    } else {
      cmdInput.type = on ? 'password' : 'text';
    }
    cmdInput.placeholder = on ? 'Password' : 'Enter command...';
    if (on) { historyIndex = -1; searchPrefix = ''; }
  }

  // ── Timer / counter chips (display only) ──────────────────────
  var lastChips = null;

  function renderChips(list) {
    lastChips = Array.isArray(list) ? list : [];
    if (lastChips.length === 0) {
      chipsRow.classList.remove('populated');
      chipsRow.innerHTML = '';
      return;
    }
    var html = '';
    for (var i = 0; i < lastChips.length; i++) {
      var c = lastChips[i];
      if (!c) continue;
      var running = c.kind !== 'scheduled';
      // Desktop-provided color, used as-is (sanitized only against quote
      // injection since it lands in a style attribute).
      var color = String(c.color || themeColor('cyan')).replace(/["'<>;]/g, '');
      var detail = c.detail == null ? '' : String(c.detail);
      html += '<span class="chip ' + (running ? 'running' : 'scheduled') +
        '" data-chip="' + esc(c.id) + '" style="color:' + color + '"' +
        (detail ? ' title="' + esc(detail) + '"' : '') + '>' +
        (running ? '<span class="chip-dot"></span>' : '') +
        esc(c.label) +
        (detail ? ' <span class="chip-detail">' + esc(detail) + '</span>' : '') +
        '</span>';
    }
    chipsRow.innerHTML = html;
    chipsRow.classList.add('populated');
  }

  // ── Tell notifications (bell toggle, persisted) ───────────────
  var notifEnabled = false;
  try { notifEnabled = localStorage.getItem('df-notify') === '1'; } catch (e) {}

  function renderNotifBtn() {
    notifBtn.classList.toggle('active', notifEnabled);
    notifBtn.title = notifEnabled ? 'Tell notifications on' : 'Tell notifications off';
  }
  renderNotifBtn();

  function setNotifEnabled(on) {
    notifEnabled = !!on;
    try { localStorage.setItem('df-notify', notifEnabled ? '1' : '0'); } catch (e) {}
    renderNotifBtn();
    if (notifEnabled) {
      haptic(15);
      try {
        if (window.Notification && Notification.permission === 'default' &&
            typeof Notification.requestPermission === 'function') {
          var p = Notification.requestPermission();
          if (p && typeof p.catch === 'function') p.catch(function() {});
        }
      } catch (e) {}
    }
  }
  notifBtn.addEventListener('click', function() { setNotifEnabled(!notifEnabled); });

  function handleTell(t) {
    if (!notifEnabled || !t || typeof t !== 'object') return;
    // Replayed state on reconnect carries old tells; only react to fresh ones.
    var at = Number(t.at);
    if (!isNaN(at) && at > 0) {
      if (at < 1e12) at *= 1000; // seconds -> ms
      if (Date.now() - at > 10000) return;
    }
    try { if (navigator.vibrate) navigator.vibrate([60, 40, 60]); } catch (e) {}
    if (!document.hidden) return;
    try {
      if (window.Notification && Notification.permission === 'granted') {
        var n = new Notification(String(t.from || 'Tell'), {
          body: String(t.text || ''),
          tag: 'df-tell',
          silent: false
        });
        n.onclick = function() { try { window.focus(); n.close(); } catch (e) {} };
      }
    } catch (e) {}
  }

  function fmtHour(h) {
    var ampm = h < 12 ? 'am' : 'pm';
    var hr = h % 12; if (hr === 0) hr = 12;
    return hr + ampm;
  }

  function renderClock(d) {
    if (!d) { clockEl.textContent = ''; return; }
    var html = '';
    if (typeof d.hour === 'number') html += '<b>' + fmtHour(d.hour) + '</b>';
    if (d.timeOfDay) html += (html ? ' · ' : '') + esc(d.timeOfDay);
    if (d.date) html += (html ? ' · ' : '') + esc(d.date);
    if (d.holiday) html += ' · ' + esc(d.holiday);
    clockEl.innerHTML = html;
  }

  // Soul-state colors — mirror the desktop Who panel's state colors. Values
  // are theme color keys resolved against currentTheme at render time, or
  // literal hex for states with no ANSI theme slot (engaged = accent orange).
  var WHO_STATE_COLORS = {
    vibrant: 'brightGreen',
    engaged: '#f97316',
    distant: 'brightYellow',
    receptive: 'brightBlue',
    dim: 'brightBlack'
  };

  function renderWho(d) {
    lastWhoData = d;
    var players = d && d.players ? d.players : [];
    var real = 0;
    for (var k = 0; k < players.length; k++) if (!players[k].isTitle) real++;
    whoBtn.textContent = real > 0 ? 'Who ' + real : 'Who';
    if (players.length === 0) {
      whoPanel.innerHTML = '<div class="aux-title">Who</div>' +
        '<div style="color:var(--fg-dim)">No one around.</div>';
      return;
    }
    var sub = [];
    if (d.totalEstimated) sub.push('~' + d.totalEstimated + ' on');
    if (d.activeToday) sub.push(d.activeToday + ' today');
    var html = '<div class="aux-title">Online' + (sub.length ? ' · ' + sub.join(' · ') : '') + '</div>';
    for (var i = 0; i < players.length; i++) {
      var p = players[i];
      if (p.isTitle) {
        html += '<div class="who-row title-row">' + esc(p.name) + '</div>';
        continue;
      }
      var color = p.color ? ('' + p.color).replace(/"/g, '') : 'var(--out-fg)';
      var stateKey = WHO_STATE_COLORS[p.state];
      var stateColor = stateKey && (currentTheme[stateKey] || stateKey);
      html += '<div class="who-row">' +
        (p.guild ? guildTagHtml(p.guild) : '') +
        '<span style="color:' + color + '">' + esc(p.name) + '</span>' +
        (stateColor ? '<span class="who-state" style="background:' + stateColor + '"></span>' : '') +
        '</div>';
    }
    whoPanel.innerHTML = html;
  }

  function renderCounters(d) {
    var list = Array.isArray(d) ? d : [];
    if (list.length === 0) {
      countersPanel.innerHTML = '<div class="aux-title">Counters</div>' +
        '<div style="color:var(--fg-dim)">No active counters.</div>';
      return;
    }
    var html = '<div class="aux-title">Improve Counters</div>';
    for (var i = 0; i < list.length; i++) {
      var c = list[i];
      html += '<div class="counter-row">' +
        '<span class="counter-name' + (c.active ? ' active' : '') + '">' + esc(c.name) + '</span>' +
        '<span class="counter-stat"><b>' + esc(c.totalImps) + '</b> imps</span>' +
        '<span class="counter-stat"><b>' + esc(c.perHour) + '</b>/hr</span>' +
        '<span class="counter-stat">' + esc(c.status) + '</span>' +
        '</div>';
    }
    countersPanel.innerHTML = html;
  }

  function renderQuickButtons(d) {
    lastQuickButtons = Array.isArray(d) ? d : null;
    if (!Array.isArray(d) || d.length === 0) {
      quickBtns.classList.remove('populated');
      quickBtns.innerHTML = '';
      return;
    }
    var html = '';
    for (var i = 0; i < d.length; i++) {
      var b = d[i];
      var color = (b.color || themeColor('cyan')).replace(/"/g, '');
      html += '<button class="qbtn' + (b.enabled ? '' : ' disabled') +
        '" data-qb="' + esc(b.id) + '" style="color:' + color + '">' +
        esc(b.label) + '</button>';
    }
    quickBtns.innerHTML = html;
    quickBtns.classList.add('populated');
  }

  quickBtns.addEventListener('click', function(e) {
    var b = e.target.closest('.qbtn');
    if (!b) return;
    var id = b.getAttribute('data-qb');
    if (!id) return;
    if (!canSend()) { rejectSend(); return; }
    haptic();
    ws.send(JSON.stringify({ type: 'quickbutton', id: id }));
  });

  // Clear the phone's output locally (the desktop scrollback is untouched).
  clearBtn.addEventListener('click', function() {
    haptic();
    clearOutput();
  });

  // Who / Counters collapsible toggles (only one open at a time).
  function togglePanel(panel, btn, other, otherBtn) {
    var open = !panel.classList.contains('open');
    panel.classList.toggle('open', open);
    btn.classList.toggle('active', open);
    if (open) { other.classList.remove('open'); otherBtn.classList.remove('active'); }
  }
  whoBtn.addEventListener('click', function() { togglePanel(whoPanel, whoBtn, countersPanel, ctrBtn); });
  ctrBtn.addEventListener('click', function() { togglePanel(countersPanel, ctrBtn, whoPanel, whoBtn); });

  // Output font-size control (persisted).
  var fontSize = wideMq.matches ? 14 : 13;
  try { var savedFs = parseInt(localStorage.getItem('df-fontsize'), 10); if (savedFs) fontSize = savedFs; } catch(e) {}
  function applyFontSize() { output.style.fontSize = fontSize + 'px'; }
  function setFontSize(next) {
    fontSize = Math.max(9, Math.min(24, next));
    applyFontSize();
    try { localStorage.setItem('df-fontsize', fontSize); } catch(e) {}
  }
  applyFontSize();
  fontDec.addEventListener('click', function() { setFontSize(fontSize - 1); });
  fontInc.addEventListener('click', function() { setFontSize(fontSize + 1); });

  // ── Quick-bar toggle (persisted) ──────────────────────────────
  var qbarVisible = true;
  try { qbarVisible = localStorage.getItem('df-qbar') !== '0'; } catch(e) {}
  if (!qbarVisible) quickBar.classList.add('collapsed');

  qbarToggle.addEventListener('click', function() {
    qbarVisible = !qbarVisible;
    quickBar.classList.toggle('collapsed', !qbarVisible);
    qbarToggle.innerHTML = qbarVisible ? '&#x25B2; D-Pad' : '&#x25BC; D-Pad';
    try { localStorage.setItem('df-qbar', qbarVisible ? '1' : '0'); } catch(e) {}
  });

  // ── Auto-scroll detection ────────────────────────────────────
  // Only a scroll the *user* started may unpin the view. Layout changes the
  // page doesn't control — the on-screen keyboard opening or closing, the
  // quick bar collapsing, a font-size change, old lines being trimmed off the
  // top — all move the scroll offset and used to be read as "the user scrolled
  // up", which left the output stuck partway up after sending a command.
  var userScrollUntil = 0;
  /** Extend the window in which scroll events count as user-driven. */
  function markUserScroll() {
    userScrollUntil = Date.now() + 1200;
  }
  ['touchstart', 'touchmove', 'wheel', 'mousedown'].forEach(function(evt) {
    output.addEventListener(evt, markUserScroll, { passive: true });
  });

  function pinToBottom() {
    output.scrollTop = output.scrollHeight;
    autoScroll = true;
    scrollNotice.classList.remove('visible');
  }

  output.addEventListener('scroll', function() {
    var atBottom = output.scrollHeight - output.scrollTop - output.clientHeight < 40;
    if (atBottom) {
      autoScroll = true;
    } else if (Date.now() < userScrollUntil) {
      // Momentum scrolling keeps firing after the finger lifts, so each
      // user-driven scroll event extends the window.
      markUserScroll();
      autoScroll = false;
    } else if (autoScroll) {
      // Pinned, but something resized under us — re-pin instead of unpinning.
      output.scrollTop = output.scrollHeight;
      return;
    }
    scrollNotice.classList.toggle('visible', !autoScroll);
  });

  scrollNotice.addEventListener('click', pinToBottom);

  // ── Output management ────────────────────────────────────────
  function appendOutput(html) {
    if (!hasOutput) {
      hasOutput = true;
      emptyState.classList.add('hidden');
    }

    output.insertAdjacentHTML('beforeend', html);

    while (output.childNodes.length > MAX_OUTPUT_LINES) {
      output.removeChild(output.firstChild);
    }

    if (autoScroll) {
      output.scrollTop = output.scrollHeight;
    }
  }

  /** Empty the output pane and restore the empty-state placeholder. */
  function clearOutput() {
    output.innerHTML = '';
    output.appendChild(emptyState);
    emptyState.classList.remove('hidden');
    hasOutput = false;
    autoScroll = true;
    scrollNotice.classList.remove('visible');
  }

  // ── Connection status (dot + word) ────────────────────────────
  function wsOpen() {
    return !!ws && ws.readyState === WebSocket.OPEN;
  }

  function updateStatus() {
    var cls, word;
    if (companionOff) { cls = ''; word = 'Companion off'; }
    else if (!wsOpen()) { cls = ''; word = 'Reconnecting'; }
    else if (mudConnected) { cls = 'connected'; word = 'Live'; }
    else { cls = 'ws-only'; word = 'Desktop offline'; }
    statusDot.className = cls;
    statusText.className = cls;
    statusText.textContent = word;
    sendBtn.disabled = !wsOpen();
    updatePowerBtn();
  }

  // ── Banner (connection lost / companion off / not-connected flash) ──
  var BANNER_TEXT = {
    lost: 'Connection lost. Tap to reconnect.',
    off: 'Companion turned off on the desktop. Tap to retry.',
    flash: 'Not connected'
  };
  var bannerMode = null;
  var bannerFlashTimer = null;

  function setBanner(mode) {
    if (bannerFlashTimer) { clearTimeout(bannerFlashTimer); bannerFlashTimer = null; }
    bannerMode = mode;
    reconnectBanner.classList.toggle('off', mode === 'off');
    if (!mode) { reconnectBanner.classList.remove('visible'); return; }
    reconnectBanner.textContent = BANNER_TEXT[mode];
    reconnectBanner.classList.add('visible');
  }

  /** Briefly show "Not connected" when the socket is up but the desktop
      isn't attached to the MUD; a persistent banner is left as-is. */
  function flashBanner() {
    if (bannerMode === 'lost' || bannerMode === 'off') return;
    setBanner('flash');
    bannerFlashTimer = setTimeout(function() {
      bannerFlashTimer = null;
      if (bannerMode === 'flash') setBanner(null);
    }, 1200);
  }

  // ── Screen wake lock ──────────────────────────────────────────
  // Held while the socket is open and the page is visible so the phone
  // doesn't dim mid-session. Silently skipped where unsupported.
  var wakeLock = null;
  var wakeLockPending = false;

  function requestWakeLock() {
    if (!navigator.wakeLock || wakeLock || wakeLockPending) return;
    if (document.visibilityState !== 'visible' || !wsOpen()) return;
    wakeLockPending = true;
    try {
      navigator.wakeLock.request('screen').then(function(lock) {
        wakeLockPending = false;
        wakeLock = lock;
        lock.addEventListener('release', function() { if (wakeLock === lock) wakeLock = null; });
        // The socket may have closed while the request was in flight.
        if (!wsOpen()) releaseWakeLock();
      }, function() { wakeLockPending = false; });
    } catch (e) { wakeLockPending = false; }
  }

  function releaseWakeLock() {
    if (!wakeLock) return;
    var lock = wakeLock;
    wakeLock = null;
    try {
      var p = lock.release();
      if (p && typeof p.catch === 'function') p.catch(function() {});
    } catch (e) {}
  }

  // ── WebSocket ─────────────────────────────────────────────────
  var reconnectTimer = null;
  var reconnectDelay = 1000;
  var lastMsgAt = 0;
  var wsStartedAt = 0;
  var SILENCE_LIMIT_MS = 45000;   // server pings every 20s
  var CONNECT_LIMIT_MS = 15000;   // a CONNECTING socket older than this is stuck

  function clearReconnectTimer() {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  }

  function scheduleReconnect() {
    clearReconnectTimer();
    if (companionOff) return;
    reconnectTimer = setTimeout(function() {
      reconnectTimer = null;
      reconnectDelay = Math.min(reconnectDelay * 1.5, 10000);
      connect();
    }, reconnectDelay);
  }

  /** Drop whatever socket exists (without letting its close handler
      schedule another retry) and open a fresh one right away. */
  function forceReconnect() {
    clearReconnectTimer();
    reconnectDelay = 1000;
    if (ws) {
      var old = ws;
      ws = null;
      old.onopen = old.onmessage = old.onclose = old.onerror = null;
      try { old.close(); } catch (e) {}
    }
    connect();
  }

  function connect() {
    if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;
    clearReconnectTimer();

    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var wsUrl = proto + '//' + location.host + '/ws';

    var sock;
    try {
      sock = new WebSocket(wsUrl);
    } catch (e) {
      ws = null;
      updateStatus();
      setBanner('lost');
      scheduleReconnect();
      return;
    }
    ws = sock;
    wsStartedAt = Date.now();
    lastMsgAt = wsStartedAt;
    updateStatus();

    sock.onopen = function() {
      if (sock !== ws) return;
      lastMsgAt = Date.now();
      reconnectDelay = 1000;
      companionOff = false;
      setBanner(null);
      updateStatus();
      requestWakeLock();
    };

    sock.onmessage = function(e) {
      if (sock !== ws) return;
      lastMsgAt = Date.now();
      try {
        var msg = JSON.parse(e.data);
        if (msg.type === 'output') {
          appendOutput(ansiToHtml(msg.data));
        } else if (msg.type === 'ping') {
          sock.send(JSON.stringify({ type: 'pong' }));
        } else if (msg.type === 'replay') {
          // Fresh scrollback is about to arrive (or just did): start from an
          // empty pane so a reconnect never stacks duplicate history.
          if (msg.phase === 'start') clearOutput();
          else if (msg.phase === 'end') pinToBottom();
        } else if (msg.type === 'server') {
          if (msg.event === 'stopping') {
            companionOff = true;
            clearReconnectTimer();
            setBanner('off');
            updateStatus();
          }
        } else if (msg.type === 'status') {
          mudConnected = !!msg.connected;
          updateStatus();
        } else if (msg.type === 'history') {
          if (Array.isArray(msg.history)) {
            commandHistory = msg.history;
            historyIndex = -1;
            searchPrefix = '';
          }
        } else if (msg.type === 'vitals') {
          renderVitals(msg.readouts);
        } else if (msg.type === 'config') {
          if (msg.config && typeof msg.config === 'object') {
            if (msg.config.numpadMappings && typeof msg.config.numpadMappings === 'object') {
              numpadMap = msg.config.numpadMappings;
            }
            if (msg.config.theme && typeof msg.config.theme === 'object') {
              applyTheme(msg.config.theme);
            }
          }
        } else if (msg.type === 'state') {
          handleState(msg.key, msg.data);
        }
      } catch (err) {
        console.error('Parse error:', err);
      }
    };

    sock.onclose = function() {
      if (sock !== ws) return;
      releaseWakeLock();
      updateStatus();
      if (companionOff) {
        setBanner('off');
        return;
      }
      setBanner('lost');
      scheduleReconnect();
    };

    sock.onerror = function() {
      if (sock !== ws) return;
      try { sock.close(); } catch (e) {}
    };
  }

  reconnectBanner.addEventListener('click', function() {
    haptic();
    if (bannerMode === 'flash') { setBanner(null); return; }
    companionOff = false;
    forceReconnect();
  });

  // ── Liveness: wake-ups, network changes and a silence watchdog ─
  // Reconnects used to fire only from onclose, which mobile browsers often
  // never deliver after the tab was frozen. Any of these wake-ups now checks
  // the socket and reconnects immediately with the backoff reset.
  function checkConnection() {
    if (companionOff) return;
    if (wsOpen()) { requestWakeLock(); return; }
    // A socket that only just started connecting is left to finish.
    if (ws && ws.readyState === WebSocket.CONNECTING &&
        Date.now() - wsStartedAt < CONNECT_LIMIT_MS) return;
    forceReconnect();
  }

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') checkConnection();
    else releaseWakeLock();
  });
  window.addEventListener('pageshow', checkConnection);
  window.addEventListener('online', checkConnection);
  window.addEventListener('focus', checkConnection);

  // No message of any kind (server pings every 20s) for 45s while the socket
  // still looks open means the connection is dead underneath us.
  setInterval(function() {
    if (companionOff || !ws) return;
    var quiet = Date.now() - lastMsgAt;
    if (ws.readyState === WebSocket.OPEN && quiet > SILENCE_LIMIT_MS) forceReconnect();
    else if (ws.readyState === WebSocket.CONNECTING && Date.now() - wsStartedAt > CONNECT_LIMIT_MS) forceReconnect();
  }, 5000);

  // ── Send command ──────────────────────────────────────────────
  /** True only when the socket is open AND the desktop is on the MUD. */
  function canSend() {
    return wsOpen() && mudConnected;
  }

  /** A command was refused: keep the text, flash the banner, shake, buzz. */
  function rejectSend() {
    if (!wsOpen()) setBanner(companionOff ? 'off' : 'lost');
    else flashBanner();
    cmdInput.classList.remove('shake');
    void cmdInput.offsetWidth; // restart the animation
    cmdInput.classList.add('shake');
    setTimeout(function() { cmdInput.classList.remove('shake'); }, 400);
    try { if (navigator.vibrate) navigator.vibrate([40, 30, 40]); } catch (e) {}
  }

  function sendCommand(cmd) {
    var fromInput = cmd === undefined;
    if (fromInput) cmd = cmdInput.value;
    if (!canSend()) { rejectSend(); return; }
    ws.send(cmd);
    if (cmd.trim() && !passwordMode) {
      if (commandHistory.length === 0 || commandHistory[0] !== cmd) {
        commandHistory.unshift(cmd);
        if (commandHistory.length > 100) commandHistory.pop();
      }
    }
    historyIndex = -1;
    searchPrefix = '';
    if (fromInput || cmd === cmdInput.value || passwordMode) cmdInput.value = '';
    // Sending is intent to watch what happens next, so snap back to the
    // newest output even if the view was scrolled up.
    pinToBottom();
  }

  // ── History navigation (prefix-matching) ────────────────────
  function navigateHistory(isUp) {
    // On first Up press, save current input as search prefix
    if (historyIndex === -1 && isUp) {
      searchPrefix = cmdInput.value;
    }
    // Filter history by prefix
    var filtered = searchPrefix
      ? commandHistory.filter(function(h) { return h.startsWith(searchPrefix); })
      : commandHistory;
    if (filtered.length === 0) return;

    // Find current position in filtered list
    var currentFiltered = -1;
    if (historyIndex >= 0) {
      var currentCmd = commandHistory[historyIndex];
      for (var fi = 0; fi < filtered.length; fi++) {
        if (filtered[fi] === currentCmd) { currentFiltered = fi; break; }
      }
    }

    if (isUp) {
      var next = currentFiltered + 1;
      if (next < filtered.length) {
        cmdInput.value = filtered[next];
        historyIndex = commandHistory.indexOf(filtered[next]);
      }
    } else {
      if (currentFiltered > 0) {
        var prev = currentFiltered - 1;
        cmdInput.value = filtered[prev];
        historyIndex = commandHistory.indexOf(filtered[prev]);
      } else {
        historyIndex = -1;
        cmdInput.value = searchPrefix;
      }
    }
  }

  // Keep focus in the input (and the keyboard up on iOS): swallow the
  // press like the history buttons do, sending from touchstart on touch
  // devices and from click for mouse users.
  sendBtn.addEventListener('mousedown', function(e) { e.preventDefault(); });
  sendBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    haptic();
    sendCommand();
  });
  sendBtn.addEventListener('click', function() {
    haptic();
    sendCommand();
  });

  histUp.addEventListener('touchstart', function(e) {
    e.preventDefault();
    navigateHistory(true);
  });
  histUp.addEventListener('click', function() {
    navigateHistory(true);
  });

  histDown.addEventListener('touchstart', function(e) {
    e.preventDefault();
    navigateHistory(false);
  });
  histDown.addEventListener('click', function() {
    navigateHistory(false);
  });

  cmdInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendCommand();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      navigateHistory(true);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      navigateHistory(false);
    }
  });

  // ── Numpad bindings (desktop "play from laptop" mode) ─────────
  // The physical numpad sends commands, mirroring the desktop client's
  // customizable numpad mappings (pushed via the 'config' message). Keys are
  // identified by event.code so it works whether or not NumLock is on. Like
  // the desktop, the keypad always sends its bound command regardless of input
  // state (use the top-row number keys to type digits). `numpadMap` holds the
  // user's bindings; DEFAULT_NUMPAD is the fallback for any unbound key.
  var DEFAULT_NUMPAD = {
    Numpad7: 'nw', Numpad8: 'n', Numpad9: 'ne',
    Numpad4: 'w',  Numpad5: 'd', Numpad6: 'e',
    Numpad1: 'sw', Numpad2: 's', Numpad3: 'se',
    Numpad0: 'u',  NumpadAdd: 'back',
    NumpadDivide: '/counter info',
    NumpadMultiply: '/counter toggle',
    NumpadSubtract: '/movemode',
    NumpadDecimal: 'survey'
  };
  var numpadMap = {};

  document.addEventListener('keydown', function(e) {
    if (!e.code || e.code.lastIndexOf('Numpad', 0) !== 0) return;
    var mv = numpadMap[e.code];
    if (mv === undefined || mv === null) mv = DEFAULT_NUMPAD[e.code];
    if (!mv) return;
    e.preventDefault();
    // Capture-phase stop so the input's own keydown (e.g. NumLock-off
    // numpad keys reported as arrows) doesn't also fire history nav.
    e.stopPropagation();
    haptic();
    sendCommand(mv);
  }, true);

  // ── Quick command buttons (d-pad) ─────────────────────────────
  quickBar.addEventListener('click', function(e) {
    var btn = e.target.closest('.quick-btn');
    if (!btn) return;
    var cmd = btn.getAttribute('data-cmd');
    if (!cmd) return;
    haptic();
    sendCommand(cmd);
  });

  // ── Power button (toggle connect/disconnect) ─────────────────
  function updatePowerBtn() {
    powerBtn.className = mudConnected ? 'connected' : 'disconnected';
  }
  updatePowerBtn();

  powerBtn.addEventListener('click', function() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      var type = mudConnected ? 'disconnect' : 'reconnect';
      ws.send(JSON.stringify({ type: type }));
    }
  });

  // ── Virtual-keyboard resize fix ─────────────────────────────
  // Mobile browsers don't update dvh when the keyboard opens.
  // Use visualViewport to set the real height and prevent the
  // browser from scrolling the body to reveal the focused input.
  var appEl = document.getElementById('app');

  function updateViewportHeight() {
    if (window.visualViewport) {
      var h = window.visualViewport.height;
      appEl.style.height = h + 'px';
      // Kill any body scroll the browser introduced to focus the input
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
      // The output just got shorter/taller; keep the newest line in view.
      if (autoScroll) output.scrollTop = output.scrollHeight;
    }
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateViewportHeight);
    window.visualViewport.addEventListener('scroll', function() {
      // Prevent the browser from shifting the document
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
    });
    updateViewportHeight();
  }

  window.addEventListener('resize', function() {
    if (autoScroll) output.scrollTop = output.scrollHeight;
  });

  // ── Tap anywhere to focus the input ──────────────────────────
  // Mirrors the desktop client, where clicking the window puts you back in the
  // command line. Taps on anything interactive (buttons, the panels' own
  // controls) keep their own behaviour, and a tap that finished a text
  // selection is left alone so copying still works.
  document.addEventListener('click', function(e) {
    var t = e.target;
    if (t && t.closest &&
        t.closest('input, textarea, button, a, select, [contenteditable], #scroll-notice')) return;
    var sel = window.getSelection();
    if (sel && String(sel)) return;
    if (document.activeElement === cmdInput) return;
    try {
      cmdInput.focus({ preventScroll: true });
    } catch (err) {
      cmdInput.focus();
    }
  });

  // ── Start ─────────────────────────────────────────────────────
  updateStatus();
  connect();
  cmdInput.focus();
})();
</script>
</body>
</html>
